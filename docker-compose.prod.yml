services:
  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    ports:
      - "10000:10000"
    volumes:
      - ./media:/app/media
    env_file:
      - .env.production
      - static/company_info/.env
    extra_hosts:
      -  "host.docker.internal:host-gateway"
    tty: "true"
    restart: unless-stopped
      
  db_worker:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.production
      - static/company_info/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: "true"
    command: python manage.py db_worker
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
