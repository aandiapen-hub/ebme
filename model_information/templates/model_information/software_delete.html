{% extends 'base.html' %}
{% load django_bootstrap5 %}


{% block content %}    
<div class='container mb-3'>
    <h3>Delete Request: {{software}}</h3>
    <div class='row'>
        <div class='col'>

            <form action="", method="post">
                    {% bootstrap_messages %}
                    {{ form.media }}
                    {% csrf_token %} 
                    {% bootstrap_form form layout='horizontal' %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a class='btn btn-secondary' href='{% url "model_information:software_detail" pk=software.pk %}'>Cancel</a>
            </form>
        </div>
    </div>
        
    
</div>
{%endblock content%}
