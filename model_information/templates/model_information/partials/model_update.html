{% extends "base.html" %}
{% load django_bootstrap5 %}


{% block content %}
<div id='update_model'class='container bg-white p-2'>
{% include 'documents/partials/temp_file_group_mini.html' %}
<form class="form" method="post"
        hx-post="{{request.path}}"
        hx-trigger="submit"
        hx-target="#update_model"
        hx-swap="outerHTML"
        hx-select='#model-detail'>
        {% csrf_token %}
        {{form.media}}

        {% include 'partials/form_with_comparison.html' %}

        <button class="btn btn-primary" type="submit">Save</button>

        </form>
        {% if error_message %}
        <div class="alert alert-danger" role="alert">
        {{error_message}}  
        </div>
        {% endif %}
<div>
{% endblock %}
