{% extends 'base.html' %}

{% block content %}
<div class='container'>
  Brand<h3>{{brand}}</h3>

<div id="model-detail" class='container bg-white p-2'>
      <div class="row"> 
        <div class="col">
          
        </div>
        <div class='col text-end'>

          <div id="edit_div" class="dropdown">
            <button class="btn btn-outline-white border-white dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <ul class="dropdown-menu border-light dropdown-menu-end ">
              <li class='dropdown-item'>
                <!--Model Edit Button-->
                {% if perms.assets.change_tblbrands %}

                  <a
                    href="{% url 'model_information:update_brand' pk=object.pk %}"
                    class="btn text-primary">Edit
                  </a>
                {% endif %}
              </li>
              <li class='dropdown-item'>
                {% if perms.assets.delete_tblbrands %}
                  <a
                  href="{% url 'model_information:delete_brand' pk=object.pk %}"
                  class="btn text-danger">Delete
                </a>
                {% endif %}
              </li>
            </ul>

     
        </div>
      </div>
    </div>



</div>
{% endblock content %}
