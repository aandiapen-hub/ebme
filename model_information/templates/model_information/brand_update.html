{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class='container'>
        <h3>Update Brand: {{object}}</h3>
        {% bootstrap_messages %}
        <form class="form"
        method='POST'
        action="{{request.path}}">
        
        {% csrf_token %}
        {{form.media}}
        {% bootstrap_form form %}
        {% include 'partials/form_buttons.html' %}
        </form>
</div>
{% endblock content %}
