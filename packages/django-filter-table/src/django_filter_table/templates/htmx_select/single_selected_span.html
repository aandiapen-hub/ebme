
<span class="input-group-text d-flex align-items-center justify-content-between gap-1 w-100"
      data-label='{{ option.label }}'
      data-value='{{ option.value }}'>
        {{ option.label }}
        <button type="button"
                class="btn-close btn-close"
                aria-label="Remove {{ option.label }}"
                _=' on click
                  set input_div to  previous <div.hidden-input-group/>
                  remove the first <input[label="{{option.label}}"][value="{{option.value}}"]/> in input_div
                  remove closest <span/>
                '>
        </button>
</span>
