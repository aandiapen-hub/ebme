{% if object_list %}


<div class="list-group">

        {% for option in options %}
          <div>
            <button
                type="button"
                class="list-group-item list-group-item-action data-picker-option {% if option.value|stringformat:"s"  in selected %}active{%endif%}"
                data-label='{{ option.label }}'
                data-value='{{ option.value }}'>
                {{ option.label }}

            </button>

          </div>
        {% endfor %}

        {% if page_obj.has_next %}
          <div
              hx-include="closest .htmx-model-select, closes .form-control"
              hx-get="{{ request.path }}{% querystring page=page_obj.next_page_number %}"
              hx-push-url='false'
              hx-trigger='intersect once'
              hx-target="this"
              hx-swap='outerHTML'
              hx-vals='{"multiple": "{{multiple}}", "fieldname":"{{fieldname}}"}'
          ></div>
        {% else %}
            <div class="text-center text-muted py-4">
                No more results.
            </div>
        {% endif %}


  </div>
  {% else %}

      <div class="text-center text-muted py-4">
          No results found.
      </div>

{% endif %}
