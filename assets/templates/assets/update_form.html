{% extends "base.html" %}
{% load crispy_forms_tags %} <!-- Load Crispy Forms -->



{% block content %}

<div id='asset_details' class="container">

    {% include 'documents/partials/temp_file_group_mini.html' %}
    <form hx-post="{{request.path}}"
    hx-target="#asset_details"
    hx-swap="innerHTML"
    hx-trigger="submit"
    hx-push-url='true'
    hx-select='#asset_details'>
        {{ form.media }} 
        {% csrf_token %}
        
        {% include 'partials/form_with_comparison.html' %}
        <button class="btn btn-primary" type="submit">Submit</button>
    
        <!---Cancel update button-->
        <a href='{% url "assets:view_asset" pk=object.pk %}' class='btn btn-outline-secondary'>
            <i class="bi bi-backspace"></i> Cancel & Return to Asset
        </a>

    </form>
 
    
</div>
{% endblock %}
