{% extends "base.html" %}
{% load crispy_forms_tags %} <!-- Load Crispy Forms -->



{% block content %}

<div id='asset_details' class="container">

    {% include 'documents/partials/temp_file_group_mini.html' %}
    <form hx-post="{{request.path}}"
    hx-target="#asset_details"
    hx-swap="innerHTML"
    hx-trigger="submit"
    hx-push-url='true'
    hx-select='#asset_details'>
        {{ form.media }} 
        {% csrf_token %}
        {% include 'partials/form_with_comparison.html' %}
        {% include 'partials/form_buttons.html' %}
    </form>
 
</div>
{% endblock %}
