{% extends 'base.html' %}
{% load django_bootstrap5 %}


{% block content %}    
<div class='container mb-3'>
    
    
    <div class='row'>
        <div class='col'>

            <form action='', method="post">
                    {% bootstrap_messages %}
                    {{ form.media }}
                    {% csrf_token %} 
                    {% bootstrap_form form layout='horizontal' %}
                    {% include 'partials/form_buttons.html' %}
            </form>
        </div>
    </div>
        
    
</div>
{%endblock content%}
