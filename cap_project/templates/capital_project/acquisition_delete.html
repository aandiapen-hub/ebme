{% extends 'base.html' %}
{% load django_bootstrap5 %}


{% block content %}    
<div class='container mb-3'>
    
    <h3>Delete Acquisition: {{acquisition.code}} - {{acquisition.name}}</h3>
    <div class='row'>
        <div class='col'>

            <form action="", method="post">
                    {% bootstrap_messages %}
                    {{ form.media }}
                    {% csrf_token %} 
                    {% bootstrap_form form layout='horizontal' %}
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
          <a class='btn btn-sm btn-outline-secondary' href='{% url "capital_projects:acquisition_detail" pk=acquisition.id %}'>Delete</a>
            </form>
        </div>
    </div>
        
    
</div>
{%endblock content%}
