{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class='container'>
  <form
  id='form'
  method='post'
  action='{% url "documents:temp_group_delete" pk=object.pk %}'
  >
    <p>Delete group?</p>
    {% csrf_token %}
    {% bootstrap_form form %}

    {% include 'partials/form_buttons.html' with color='danger' text='Delete' %}
  </form>
</div>

{% endblock content %}
