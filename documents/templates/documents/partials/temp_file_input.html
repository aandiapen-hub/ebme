<input id='files_{{group.pk|default:0}}'
    type="file"
    name="files"
    hidden
    class="form-control"
    accept="image/*,application/pdf"
    capture="environment" multiple required
_="on change 
if my.files[0].size > 5*1024*1024
    alert('File too large (max 5MB)')
    set my.value to ''">

<button
  class='btn btn-outline-primary'
  _='on click call #files_{{group.pk|default:0}}.click()'
  type='button'>Add file <i class="bi bi-file-earmark-arrow-up"></i></button>
