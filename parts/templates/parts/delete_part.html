{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<div id="update_part" class="container">
    <h4>Delete part: {{object}}</h4>
    {% bootstrap_messages %}

    <form action="" method="post">
        {{ form.media }} 
        {% csrf_token %}
        {% bootstrap_form form %}
        {% include 'partials/form_buttons.html' with color='danger' text='Delete' %}
    </form>

</div>

{% endblock %}
