
{% if action.type == 'bulk_htmx' %}
<a
      hx-get="{{action.url}}"
      hx-include='#row_select_form, #filter-form'
      hx-target='#bulk_update_content'
      hx-indicator='.htmx-indicator'
      hx-swap='innerHTML'
      class="dropdown-item btn btn-sm btn-{{action.color}}"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#bulk_update_offcanvas"
      aria-controls="bulk_update_offcanvas">
      {{ action.name }} <i class="bi {{action.icon}}"></i>
  </a>

{% elif action.type == 'link' %}
<a 
  class="btn btn-sm btn-{{action.color}}"
  href="{{action.url}}"
  >
  {{action.name}} <i class="bi {{action.icon}}"></i>
</a>
{% elif action.type == 'htmx' %}

    <button 
      class="dropdown-item btn btn-sm btn-{{action.color}}"
      hx-get="{{action.url}}?{{action.qp}}"
      hx-include='#filter-form, #row_select_form'
      type='button'
      hx-trigger='click'>
      {{ action.name }} <i class="bi {{action.icon}}"></i>
    </button>
{% endif %}
