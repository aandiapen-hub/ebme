
{% load static %}
{% load django_bootstrap5 %}

<div id="filter-column"  hx-swap-oob='innerHTML' >
  <div id='div_filter_fields' class='d-flex flex-wrap gap-3'>
    {{ filter.form.media }}
    {% bootstrap_messages %}
    {% for field in filter.form %}
      {% if 'search' in field.name %}
        <div id="div_id_{{ field.name }}" class='d-flex m-1 p-1 gap-1 align-items-center' >
              <div>
                {{ field.label_tag }}
              </div>
              <div>
                {{ field }}
              </div>
        </div>
      {% else %}

        <div id="div_id_{{ field.name }}" class='d-flex m-1 p-1 gap-1 align-items-center' >
          <div>
            {{ field.label_tag }}
          </div>
          <div>
            {{ field }}
          </div>
          <div>
                <i class="bi  bi-x-circle text-danger"
                  type='button'
                    _="
                    on click
                        remove #div_id_{{field.name}}
                        wait 100ms
                        trigger submit on #filter-form
                    ">
                  </i>
          </div>

        </div>


      {% endif %}
    {% endfor %}

  </div>

  <div class='row mt-1'>
    <div class='col'>
        <button hidden id='filter_form_submit_button' class='btn btn-warning'  type='submit'>Apply filters</button>
    </div>
  </div>
</div>
