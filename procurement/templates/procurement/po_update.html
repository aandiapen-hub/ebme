{% extends "base.html" %}
{% load crispy_forms_tags %} <!-- Load Crispy Forms -->



{% block content %}

<div id='order_details' class="container">

    <form 
            hx-post="{{request.path}}"
              hx-target="#order_details"
              hx-trigger="submit"
              hx-push-url='true'
              hx-select='#order_details'
              hx-swap='outerHTML'>
        {{ form.media }} 
        {% csrf_token %}
        
        {{ form|crispy }}

        
        {% include 'partials/dynamic_formset.html' with formset=po_line %}

        <button class="btn btn-primary" type="submit">Submit</button>
    </form>
</div>
{% endblock %}
