{% extends "base.html" %}
{% load django_bootstrap5 %} <!-- Load Crispy Forms -->

{% block content %}

<div id='order_details' class="container">

    <form method='post' action="{{request.path}}" novalidate>
        {{ form.media }} 
        {% csrf_token %}
        
        {% bootstrap_form form %}

        
        {% include 'partials/dynamic_formset.html' with formset=po_line %}
        <button class="btn btn-primary" type="submit">Save</button>

    </form>
</div>
{% endblock %}
