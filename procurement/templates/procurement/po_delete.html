{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<div class="container">
    <form
      method='POST'
      action="{% url 'procurement:po_delete' pk=po.pk %}" >

      <h4> Deleting PO: {{po}}</h4>
        {% csrf_token %}
 
        {% bootstrap_form form %}
        Are you sure you would like to delete {{po}}

        {% include 'partials/form_buttons.html' with color='danger' text='Delete' %}
    </form>

</div>

{% endblock %}
