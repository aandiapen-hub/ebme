{% extends "base.html" %}
{% load django_bootstrap5 %}



{% block content %}

<div class="container">

    <form action="{{request.path}}" method="post">
        {{ form.media }} 
        {% csrf_token %}
        
        {% bootstrap_form form %}
        <button class="btn btn-primary" type="submit">Submit</button>
    </form>
</div>
{% endblock %}
