services:
  web:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.development
      - static/company_info/.env
    extra_hosts:
      -  "host.docker.internal:host-gateway"
    tty: "true"
    command: python manage.py runserver 0.0.0.0:8000

  db_worker:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.development
      - static/company_info/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: "true"
    command: python manage.py db_worker
    restart: unless-stopped
    
  redis:
    image: redis:latest
